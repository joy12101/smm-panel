<!DOCTYPE html>
<html>
<head>
  <title>Register</title>

  <style>

    body{
      background:#0f0f0f;
      font-family:Arial;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      color:white;
    }

    .box{
      background:#1b1b1b;
      padding:30px;
      border-radius:20px;
      width:320px;
      text-align:center;
    }

    input{
      width:90%;
      padding:12px;
      margin:10px;
      border:none;
      border-radius:10px;
      background:#2b2b2b;
      color:white;
    }

    button{
      width:95%;
      padding:12px;
      border:none;
      border-radius:10px;
      background:#00ff99;
      color:black;
      font-weight:bold;
      cursor:pointer;
    }

  </style>

</head>

<body>

<div class="box">

  <h1>Create Account</h1>

  <input type="text" placeholder="Username">

  <input type="email" placeholder="Email">

  <input type="password" placeholder="Password">

  <button>
    Register
  </button>

</div>

</body>
</html>
