<!DOCTYPE html>
<html>
<head>
  <title>Register</title>

  <style>

    body{
      background:#0f0f0f;
      font-family:Arial;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      color:white;
    }

    .box{
      background:#1b1b1b;
      padding:30px;
      border-radius:20px;
      width:320px;
      text-align:center;
    }

    input{
      width:90%;
      padding:12px;
      margin:10px;
      border:none;
      border-radius:10px;
      background:#2b2b2b;
      color:white;
    }

    button{
      width:95%;
      padding:12px;
      border:none;
      border-radius:10px;
      background:#00ff99;
      color:black;
      font-weight:bold;
      cursor:pointer;
    }

  </style>

</head>

<body>

<div class="box">

  <h1>Create Account</h1>

  <input type="text" placeholder="Username">

  <input type="email" id="email" placeholder="Email">

  <input type="password" id="password" placeholder="Password">

  <button>
    Register
  </button>

</div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

  apiKey: "AIzaSyAY_M4F_GDz4N2cLmhMx_mckGdOrwDuDoM",

  authDomain: "boost-up-bd.firebaseapp.com",

  projectId: "boost-up-bd",

  storageBucket: "boost-up-bd.firebasestorage.app",

  messagingSenderId: "1035924954392",

  appId: "1:1035924954392:web:b89fbe353b43e3b2d7d26d"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

window.register = async function(){

  const email =
  document.getElementById("email").value;

  const password =
  document.getElementById("password").value;

  try{

    await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );

    alert("Account Created Successfully 🔥");

  }catch(error){

    alert(error.message);

  }

}

</script>
</body>
</html>
